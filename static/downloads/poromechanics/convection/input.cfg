[sim]
modelname = box
max_time_in_yr = 1e9
output_time_interval_in_yr = 1e9
has_output_during_remeshing = no
is_outputting_averaged_fields = no
max_steps = 400
output_step_interval = 10
checkpoint_frame_interval = 10
has_initial_checkpoint = yes

[mesh]
meshing_option = 1
xlength = 1
ylength = 1
zlength = 1
resolution = 0.025
largest_size = 0.025
smallest_size = 0.025
refined_zonex = [0.0, 1.0]
refined_zoney = [0.0, 1.0]
refined_zonez = [0.0, 1.0]
remeshing_option = 0

[control]
surface_process_option = 0
surface_diffusivity = 1e-7
damping_option = 0
damping_factor = 0.3
is_quasi_static = true
inertial_scaling = 1e6
has_hydraulic_diffusion = true
has_PT = false
PT_max_iter = 10000
PT_relative_tolerance = 1e-10
has_moving_mesh = false
PT_absolute_tolerance = 1e-8
use_global_velocity_scaling = false
gravity = 10.0
fixed_dt = 1000.0
has_thermal_diffusion = true
has_fluid_thermal_advection = true
has_poroelastic_pressure_feedback = false

[bc]
vbc_x0 = 1
vbc_x1 = 1
vbc_val_x0 = 0
vbc_val_x1 = 0
vbc_y0 = 1
vbc_y1 = 1
vbc_val_y0 = 0
vbc_val_y1 = 0
vbc_z0 = 1
vbc_z1 = 1
vbc_val_z0 = 0
vbc_val_z1 = 0
has_winkler_foundation = no
has_water_loading = no
surface_temperature = 273.0
mantle_temperature = 283.0
hbc_x0 = 0
hbc_x1 = 0
hbc_y0 = 0
hbc_y1 = 0
hbc_z0 = 0
hbc_z1 = 0
stress_bc_z1 = 0
stress_val_z1 = 0
tbc_x0 = 0
tbc_x1 = 0
tbc_y0 = 0
tbc_y1 = 0
tbc_z0 = 1
tbc_z1 = 1
tbc_val_z0 = 283.0
tbc_val_z1 = 273.0

[ic]
weakzone_option = 1
has_body_force_adjustment = false
temperature_option = 5
temp_anomaly_amplitude = 0.001
temp_anomaly_xcenter = 0.25
temp_anomaly_zcenter = -0.5
temp_anomaly_xsemi_axis = 0.25
temp_anomaly_ysemi_axis = 0.25
temp_anomaly_zsemi_axis = 0.25

[mat]
rheology_type = elastic
rho0 = [1000.0]
bulk_modulus = [1e9]
shear_modulus = [1e9]
porosity = [0.5]
hydraulic_perm = [7.895683520871486e-10]
fluid_rho0 = [1000.0]
fluid_alpha = [0.001]
fluid_bulk_modulus = [1e3]
fluid_visc = [0.001]
biot_coeff = [1]
bulk_modulus_s = [1e12]
alpha = [0]
heat_capacity = [1000.0]
therm_cond = [1.0]
fluid_heat_capacity = [1000.0]
retention_model = [0]

