name: Deploy to GitHub Pages

# The site is published at https://geoflac.github.io/DynEarthSol/ by pushing
# the build to the gh-pages branch of GeoFLAC/DynEarthSol (a Pages site is
# always served under its own repository's name, so it cannot be deployed
# from here directly). des3d's own Pages site, the old address
# https://geoflac.github.io/des3d/, keeps serving redirects to the new one.

on:
  push:
    branches:
      - main

# Never run two deployments at once: both push to the same branch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Clear Docusaurus Cache
        run: rm -rf .docusaurus/.cache

      - name: Build website
        run: yarn build

      - name: Build redirect site for the old /des3d/ address
        run: >-
          python3 scripts/make_redirect_site.py build redirect-site
          --new-base https://geoflac.github.io/DynEarthSol/
          --old-base /des3d/ --copy downloads --copy tutorial

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          include-hidden-files: true

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site

  publish:
    name: Publish to DynEarthSol gh-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build

      - name: Push to GeoFLAC/DynEarthSol gh-pages
        env:
          # Private half of a write deploy key registered on GeoFLAC/DynEarthSol.
          DEPLOY_KEY: ${{ secrets.DYNEARTHSOL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          git clone --quiet --depth 1 --branch gh-pages \
            git@github.com:GeoFLAC/DynEarthSol.git site
          git -C site rm -rq --ignore-unmatch .
          cp -a build/. site/
          touch site/.nojekyll

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to publish."
            exit 0
          fi
          git commit --quiet -m "Deploy des3d ${GITHUB_SHA::7}" \
            -m "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push --quiet origin gh-pages

  deploy:
    name: Deploy redirects to des3d Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
