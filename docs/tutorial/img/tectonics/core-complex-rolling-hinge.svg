<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="The rolling hinge: a brittle layer is pulled apart at both walls; a pre-softened seed fault cuts to the surface, the hanging wall drops into a basin, the footwall rises and the fault rotates to a gentle dip as it is exhumed">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}</style>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs>
<rect width="960" height="460" rx="16" fill="#F7F6F2"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">the rolling hinge</text>
<text x="80" y="70" font-size="16" fill="#374151" opacity="0">t = 0: a pre-softened seed in the lower half of a brittle layer being pulled apart<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="80" y="70" font-size="16" fill="#374151" opacity="0">the fault cuts to the surface; the hanging wall drops, the footwall rises<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="80" y="70" font-size="16" fill="#374151" opacity="0">the footwall keeps rising and the fault starts to rotate<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="80" y="70" font-size="16" fill="#374151" opacity="0">rolling hinge: the fault flattens as the footwall is exhumed<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="80" y="70" font-size="16" fill="#374151" opacity="0">rolling hinge: the fault flattens as the footwall is exhumed<animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="880" y="70" text-anchor="end" font-size="16" font-weight="700" fill="#374151" opacity="0">t = 0 kyr<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="880" y="70" text-anchor="end" font-size="16" font-weight="700" fill="#374151" opacity="0">t = 0 → 25 kyr<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="880" y="70" text-anchor="end" font-size="16" font-weight="700" fill="#374151" opacity="0">t = 25 → 60 kyr<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="880" y="70" text-anchor="end" font-size="16" font-weight="700" fill="#374151" opacity="0">t = 60 → 100 kyr<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="880" y="70" text-anchor="end" font-size="16" font-weight="700" fill="#374151" opacity="0">t = 100 kyr<animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.12;0.32;0.58;0.86;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
