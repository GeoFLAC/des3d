<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 916" width="1000" height="916" role="img" aria-label="Three model geometries with two decollements: a lower one along the base from the pushing wall to xa and an upper one at 1.5 to 2.5 km depth from xb to the right wall; an 8 km gap, a 2 km overlap and a 14 km overlap">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}</style>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs>
<rect width="1000" height="916" rx="16" fill="#F7F6F2"/>
<text x="500.0" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#374151">ramp-*.poly: two decollements, three arrangements</text>
<text x="500.0" y="64" text-anchor="middle" font-size="14" fill="#6B7280">40 × 5 km, vertical exaggeration 2×; both decollements 1 km thick, friction 1°; pushed from the left as before</text>
<text x="110" y="106" font-size="16" font-weight="700" fill="#374151">Gap of 8 km (xa = 12, xb = 20)</text>
