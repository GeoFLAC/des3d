<text class="ink" x="590" y="100" font-size="14" font-weight="600">Legend</text>
<line class="ri" x1="590" x2="624" y1="128" y2="128" stroke-width="3"/>
<text class="ink" x="636" y="133" font-size="14">rate-independent (τ = 0)</text>
<text class="mute" x="636" y="150" font-size="12">gone after one step</text>
<line class="dl" x1="590" x2="624" y1="180" y2="180" stroke-width="3"/>
<text class="ink" x="636" y="185" font-size="14">e^(−t/τ)</text>
<text class="mute" x="636" y="202" font-size="12">continuous DL relaxation</text>
<rect class="dlF" x="602" y="227" width="10" height="10"/>
<text class="ink" x="636" y="237" font-size="14">DL, dt = 2τ</text>
<text class="mute" x="636" y="254" font-size="12">(1 − w) = 1/3 per step</text>
<circle class="dl" cx="607" cy="284" r="4.5" stroke-width="2"/>
<text class="ink" x="636" y="289" font-size="14">DL, dt = τ/2</text>
<text class="mute" x="636" y="306" font-size="12">(1 − w) = 2/3 per step</text>
<text class="ink" x="24" y="436" font-size="13">Each DL step is a backward-Euler step of  dσ/dt = −(σ − σ_RI)/τ :  σ = (τ·σ_trial + dt·σ_RI)/(τ + dt) = (1 − w)·σ_trial + w·σ_RI</text>
<text class="mute" x="24" y="456" font-size="13">Left after n steps: (τ/(τ + dt))ⁿ → e^(−t/τ) as dt → 0. The time scale is τ, a material property, not dt.</text>
