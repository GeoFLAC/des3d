<text class="mute" x="590.0" y="362" font-size="12" text-anchor="middle">position across the band  (ticks = element edges)</text>
<text class="riF" x="210" y="392" font-size="14" font-weight="600" text-anchor="middle">width ≈ 2 elements → 0 as h → 0</text>
<text class="mute" x="210" y="412" font-size="13" text-anchor="middle">peak plastic strain grows like 1/h</text>
<text class="dlF" x="590" y="392" font-size="14" font-weight="600" text-anchor="middle">width set by τ and loading rate</text>
<text class="mute" x="590" y="412" font-size="13" text-anchor="middle">refinement only resolves the same profile better</text>
<text class="mute" x="24" y="450" font-size="12">Vertical scales differ between panels (the τ = 0 peak at h/4 is ~6× taller). Profiles are illustrative, not DES output;</text>
<text class="mute" x="24" y="466" font-size="12">the DL width is tied to τ through the loading rate (τ ~ W/V, see “Picking tau”).</text>
