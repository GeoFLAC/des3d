<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Animated stress-space sketch: the Duvaut-Lions stress slides along the chord from the elastic trial to the rate-independent return">
<title>Animated stress-space sketch: the Duvaut-Lions stress slides along the chord from the elastic trial to the rate-independent return</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.mute{fill:#59636e}
.ax{stroke:#59636e;fill:none}.grid{stroke:#d8dee4;fill:none}
.ri{stroke:#bc4c00;fill:none}.riF{fill:#bc4c00}
.dl{stroke:#0969da;fill:none}.dlF{fill:#0969da}
.el{stroke:#8c959f;fill:none}.elF{fill:#8c959f}
.zone{fill:#ddf4ff}.zoneS{stroke:#54aeff}
.card{fill:#f6f8fa;stroke:#d0d7de}
.riCard{fill:#fff1e5;stroke:#ffb77c}.dlCard{fill:#ddf4ff;stroke:#80ccff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.ink{fill:#e6edf3}.mute{fill:#9198a1}
.ax{stroke:#9198a1}.grid{stroke:#21262d}
.ri{stroke:#f0883e}.riF{fill:#f0883e}
.dl{stroke:#58a6ff}.dlF{fill:#58a6ff}
.el{stroke:#6e7681}.elF{fill:#6e7681}
.zone{fill:#0c2d6b}.zoneS{stroke:#388bfd}
.card{fill:#161b22;stroke:#30363d}
.riCard{fill:#3d1d00;stroke:#9e4a00}.dlCard{fill:#0c2d6b;stroke:#1f6feb}
}

</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="459" rx="8"/>
<text class="ink" x="24" y="34" font-size="18" font-weight="600">One step in stress space</text>
<text class="mute" x="24" y="56" font-size="14">The update lands on the chord between the elastic trial and the rate-independent return</text>
<defs><clipPath id="pane"><rect x="20" y="70" width="470" height="345"/></clipPath></defs>
<g clip-path="url(#pane)"><circle class="zone" cx="170" cy="330" r="200" opacity="0.7"/><circle class="zoneS" cx="170" cy="330" r="200" fill="none" stroke-width="2.5"/></g>
<text class="mute" x="70" y="380" font-size="14">elastic</text><text class="mute" x="70" y="398" font-size="14">domain</text>
<text class="mute" x="382" y="324" font-size="14">yield surface</text>
<text class="mute" x="382" y="342" font-size="14">f(σ) = 0</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="elF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="riF"/></marker></defs>
<line class="el" x1="276.0" y1="160.4" x2="445.0" y2="136.4" stroke-width="2" marker-end="url(#ah)"/>
<line class="ri" x1="451.0" y1="135.4" x2="334.4" y2="216.1" stroke-width="2" stroke-dasharray="6 5"/>
<circle class="ink" cx="276.0" cy="160.4" r="5"/>
<text class="ink" x="266.0" y="184.4" font-size="14" text-anchor="end">σ<tspan dy="4" font-size="11">n</tspan><tspan dy="-4"> </tspan></text>
<circle class="elF" cx="451.0" cy="135.4" r="7"/>
<text class="ink" x="463.0" y="131.4" font-size="14">σ<tspan dy="4" font-size="11">trial</tspan><tspan dy="-4"> </tspan></text>
<text class="mute" x="463.0" y="149.4" font-size="12">elastic predictor</text>
<circle class="riF" cx="334.4" cy="216.1" r="7"/>
<text class="ink" x="320.4" y="242.1" font-size="14" text-anchor="end">σ<tspan dy="4" font-size="11">RI</tspan><tspan dy="-4"> </tspan></text>
<text class="mute" x="320.4" y="258.1" font-size="12" text-anchor="end">rate-independent return</text>
<circle class="dlF" r="9" stroke="#ffffff" stroke-width="2" cx="451.0" cy="135.4"><animate attributeName="cx" values="451.0;451.0;334.4;334.4;451.0" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="135.4;135.4;216.1;216.1;135.4" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="dlF" x="408.7" y="183.8" font-size="14" font-weight="600">σ (DL)</text>
<line class="grid" x1="520" x2="520" y1="80" y2="430"/>
<text class="ink" x="540" y="100" font-size="15" font-weight="600">As w goes 0 → 1</text>
<rect class="card" x="560" y="160" width="70" height="200" rx="3"/>
<rect class="riF" x="560" y="160" width="70" height="200" rx="3"><animate attributeName="height" values="200;200;0;0;200" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="160;160;360;360;160" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/></rect>
<text class="ink" x="595" y="382" font-size="13" text-anchor="middle">overstress</text>
<rect class="card" x="680" y="160" width="70" height="200" rx="3"/>
<rect class="dlF" x="680" y="360" width="70" height="0" rx="3"><animate attributeName="height" values="0;0;200;200;0" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="360;360;160;160;360" keyTimes="0;0.1;0.5;0.6;1" dur="8s" repeatCount="indefinite"/></rect>
<text class="ink" x="715" y="382" font-size="13" text-anchor="middle">plastic incr.</text>
<text class="mute" x="540" y="410" font-size="12">overstress = (1 − w)·|σ_trial − σ_RI|</text>
<text class="mute" x="540" y="427" font-size="12">depls = w · depls_RI</text>
<text class="mute" x="24" y="446" font-size="12">w = 0: stays at σ_trial (outside the surface, for now) · w = 1: snaps to σ_RI in one step, as today</text>
</svg>
