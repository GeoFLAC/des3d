<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385" role="img" aria-label="Feedback loop: without tau a narrowing band runs away to one element; with tau the rate-dependent overstress limits narrowing">
<title>Feedback loop: without tau a narrowing band runs away to one element; with tau the rate-dependent overstress limits narrowing</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.mute{fill:#59636e}
.ax{stroke:#59636e;fill:none}.grid{stroke:#d8dee4;fill:none}
.ri{stroke:#bc4c00;fill:none}.riF{fill:#bc4c00}
.dl{stroke:#0969da;fill:none}.dlF{fill:#0969da}
.el{stroke:#8c959f;fill:none}.elF{fill:#8c959f}
.zone{fill:#ddf4ff}.zoneS{stroke:#54aeff}
.card{fill:#f6f8fa;stroke:#d0d7de}
.riCard{fill:#fff1e5;stroke:#ffb77c}.dlCard{fill:#ddf4ff;stroke:#80ccff}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.ink{fill:#e6edf3}.mute{fill:#9198a1}
.ax{stroke:#9198a1}.grid{stroke:#21262d}
.ri{stroke:#f0883e}.riF{fill:#f0883e}
.dl{stroke:#58a6ff}.dlF{fill:#58a6ff}
.el{stroke:#6e7681}.elF{fill:#6e7681}
.zone{fill:#0c2d6b}.zoneS{stroke:#388bfd}
.card{fill:#161b22;stroke:#30363d}
.riCard{fill:#3d1d00;stroke:#9e4a00}.dlCard{fill:#0c2d6b;stroke:#1f6feb}
}

</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="384" rx="8"/>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="elF"/></marker></defs>
<text class="ink" x="24" y="34" font-size="18" font-weight="600">Why τ stops the band from collapsing</text>
<text class="mute" x="24" y="56" font-size="14">Follow what happens when a softening band tries to get narrower</text>
<text class="riF" x="24" y="130" font-size="16" font-weight="700">τ = 0</text>
<rect class="riCard" x="90" y="90" width="150" height="64" rx="8"/>
<text class="ink" x="165.0" y="118" font-size="13" font-weight="600" text-anchor="middle">band narrows</text>
<text class="mute" x="165.0" y="137" font-size="12" text-anchor="middle">to W′ &lt; W</text>
<line class="el" x1="243" x2="267" y1="122" y2="122" stroke-width="2" marker-end="url(#a5)"/>
<rect class="riCard" x="270" y="90" width="150" height="64" rx="8"/>
<text class="ink" x="345.0" y="118" font-size="13" font-weight="600" text-anchor="middle">plastic strain rate</text>
<text class="mute" x="345.0" y="137" font-size="12" text-anchor="middle">in band ~ V/W′ ↑</text>
<line class="el" x1="423" x2="447" y1="122" y2="122" stroke-width="2" marker-end="url(#a5)"/>
<rect class="riCard" x="450" y="90" width="150" height="64" rx="8"/>
<text class="ink" x="525.0" y="118" font-size="13" font-weight="600" text-anchor="middle">no rate penalty:</text>
<text class="mute" x="525.0" y="137" font-size="12" text-anchor="middle">σ snaps to softened yield</text>
<line class="el" x1="603" x2="627" y1="122" y2="122" stroke-width="2" marker-end="url(#a5)"/>
<rect class="riCard" x="630" y="90" width="150" height="64" rx="8"/>
<text class="ink" x="705.0" y="118" font-size="13" font-weight="600" text-anchor="middle">softening concentrates</text>
<text class="mute" x="705.0" y="137" font-size="12" text-anchor="middle">even more</text>
<path class="ri" d="M705.0,154 v16 H165.0 v-14" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a5)"/>
<text class="mute" x="435.0" y="186" font-size="12" text-anchor="middle">repeat</text>
<text class="riF" x="776" y="210" font-size="13" font-weight="600" text-anchor="end">→ runaway: band shrinks to the smallest element</text>
<text class="dlF" x="24" y="280" font-size="16" font-weight="700">τ > 0</text>
<rect class="dlCard" x="90" y="240" width="150" height="64" rx="8"/>
<text class="ink" x="165.0" y="268" font-size="13" font-weight="600" text-anchor="middle">band narrows</text>
<text class="mute" x="165.0" y="287" font-size="12" text-anchor="middle">to W′ &lt; W</text>
<line class="el" x1="243" x2="267" y1="272" y2="272" stroke-width="2" marker-end="url(#a5)"/>
<rect class="dlCard" x="270" y="240" width="150" height="64" rx="8"/>
<text class="ink" x="345.0" y="268" font-size="13" font-weight="600" text-anchor="middle">plastic strain rate</text>
<text class="mute" x="345.0" y="287" font-size="12" text-anchor="middle">in band ~ V/W′ ↑</text>
<line class="el" x1="423" x2="447" y1="272" y2="272" stroke-width="2" marker-end="url(#a5)"/>
<rect class="dlCard" x="450" y="240" width="150" height="64" rx="8"/>
<text class="ink" x="525.0" y="268" font-size="13" font-weight="600" text-anchor="middle">overstress ↑</text>
<text class="mute" x="525.0" y="287" font-size="12" text-anchor="middle">σ − σ_RI ≈ τ·C:ε̇p</text>
<line class="el" x1="603" x2="627" y1="272" y2="272" stroke-width="2" marker-end="url(#a5)"/>
<rect class="dlCard" x="630" y="240" width="150" height="64" rx="8"/>
<text class="ink" x="705.0" y="268" font-size="13" font-weight="600" text-anchor="middle">rate-capped softening</text>
<text class="mute" x="705.0" y="287" font-size="12" text-anchor="middle">neighbours yield too</text>
<path class="dl" d="M705.0,304 v16 H165.0 v-14" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a5)"/>
<text class="mute" x="435.0" y="336" font-size="12" text-anchor="middle">pushes the band back out</text>
<text class="dlF" x="776" y="360" font-size="13" font-weight="600" text-anchor="end">→ self-limiting: width settles where overstress balances softening</text>
</svg>
